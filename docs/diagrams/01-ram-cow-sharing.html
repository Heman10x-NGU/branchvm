<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Snapshot &amp; RAM Copy-on-Write Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f4;
      --color-ink:     #141414;
      --color-muted:   #525252;
      --color-soft:    #737373;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">01 · MEMORY ARCHITECTURE · MONOCHROME</p>
    <h1>How Concurrent Agents Share One Golden RAM Snapshot</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ram-cow-title ram-cow-desc">
        <title id="ram-cow-title">Golden Snapshot and RAM Copy-on-Write Sharing</title>
        <desc id="ram-cow-desc">Architecture showing three concurrent microVM branches reading shared read-only RAM pages from one golden snapshot and allocating private 4 KB Copy-on-Write pages only when writing.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#525252"/>
          </marker>
          <marker id="arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#141414"/>
          </marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#737373"/>
          </marker>
        </defs>

        <!-- Clean paper background -->
        <rect width="100%" height="100%" fill="#f5f5f4"/>

        <!-- ZONES (drawn before arrows and nodes) -->
        <rect x="320" y="48" width="264" height="392" rx="8" fill="rgba(20,20,20,0.025)" stroke="rgba(20,20,20,0.14)" stroke-width="0.8"/>
        <rect x="336" y="52" width="144" height="14" rx="2" fill="#f5f5f4"/>
        <text x="408" y="62" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST PHYSICAL RAM</text>

        <rect x="644" y="48" width="276" height="392" rx="8" fill="rgba(20,20,20,0.025)" stroke="rgba(20,20,20,0.14)" stroke-width="0.8"/>
        <rect x="660" y="52" width="160" height="14" rx="2" fill="#f5f5f4"/>
        <text x="740" y="62" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONCURRENT BRANCHES</text>

        <!-- CONNECTORS (drawn before nodes) -->
        <!-- Golden Snapshot -> Shared Base RAM (straight horizontal at y=160) -->
        <line x1="248" y1="160" x2="344" y2="160" stroke="#141414" stroke-width="1.6" marker-end="url(#arrow-focal)"/>
        <rect x="256" y="136" width="80" height="14" rx="2" fill="#f5f5f4"/>
        <text x="296" y="146" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MAP_PRIVATE</text>

        <!-- Shared Base RAM -> Branch 1 (y=124 straight horizontal) -->
        <line x1="560" y1="124" x2="668" y2="124" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>
        <rect x="572" y="100" width="84" height="14" rx="2" fill="#f5f5f4"/>
        <text x="614" y="110" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">READ SHARED</text>

        <!-- Shared Base RAM -> Branch 2 (port y=160, elbow at x=608 to y=232) -->
        <path d="M 560,160 H 600 Q 608,160 608,168 V 224 Q 608,232 616,232 H 668" fill="none" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>

        <!-- Shared Base RAM -> Branch 3 (port y=196, elbow at x=592 to y=344) -->
        <path d="M 560,196 H 584 Q 592,196 592,204 V 336 Q 592,344 600,344 H 668" fill="none" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>

        <!-- Branch 2 -> Private Dirty Pages (dashed, port y=264, elbow at x=628, hop over x=592 at y=316) -->
        <path d="M 668,264 H 636 Q 628,264 628,272 V 308 Q 628,316 620,316 H 600 a 8,8 0 0,0 -16,0 H 560" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>

        <!-- Branch 3 -> Private Dirty Pages (dashed, straight horizontal at y=380) -->
        <line x1="668" y1="380" x2="560" y2="380" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <rect x="572" y="390" width="84" height="14" rx="2" fill="#f5f5f4"/>
        <text x="614" y="400" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE FAULT</text>

        <!-- NODES -->
        <!-- 1. Golden Snapshot -->
        <rect x="40" y="100" width="208" height="120" rx="6" fill="#f5f5f4"/>
        <rect x="40" y="100" width="208" height="120" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="52" y="110" width="64" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="84" y="120" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAPSHOT</text>
        <text x="144" y="150" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Golden RAM Snapshot</text>
        <text x="144" y="172" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vm.mem (1 GiB frozen)</text>
        <text x="144" y="190" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">262,144 pages x 4 KB</text>

        <!-- Measured RAM Density Card (bottom left, real benchmark numbers) -->
        <rect x="40" y="284" width="208" height="132" rx="6" fill="#f5f5f4"/>
        <rect x="40" y="284" width="208" height="132" rx="6" fill="rgba(20,20,20,0.035)" stroke="rgba(20,20,20,0.28)" stroke-width="0.8"/>
        <rect x="52" y="294" width="68" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="86" y="304" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEASURED</text>
        <text x="144" y="330" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Real Host RAM Used</text>
        <text x="144" y="352" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">1 clone  : 403 MiB</text>
        <text x="144" y="370" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">3 clones : 461 MiB (+58)</text>
        <text x="144" y="392" fill="#141414" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">10 clones: 620 MiB (16.5x)</text>

        <!-- 2. Shared Base RAM Pages (FOCAL) -->
        <rect x="344" y="92" width="216" height="136" rx="6" fill="#f5f5f4"/>
        <rect x="344" y="92" width="216" height="136" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <rect x="356" y="102" width="76" height="14" rx="2" fill="#141414"/>
        <text x="394" y="112" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SHARED ONCE</text>
        <text x="452" y="142" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shared Base RAM Pages</text>
        <text x="452" y="164" fill="#141414" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~403 MiB loaded ONCE</text>
        <text x="452" y="182" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kernel + PG16 + binaries</text>
        <text x="452" y="200" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">read-only by all clones</text>

        <!-- 3. Private CoW Dirty Pages -->
        <rect x="344" y="284" width="216" height="132" rx="6" fill="#f5f5f4"/>
        <rect x="344" y="284" width="216" height="132" rx="6" fill="rgba(20,20,20,0.04)" stroke="#525252" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="356" y="294" width="84" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="398" y="304" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COPY ON WRITE</text>
        <text x="452" y="334" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Private Dirty Pages</text>
        <text x="452" y="356" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~30-60 MiB per branch</text>
        <text x="452" y="374" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">copies only modified 4 KB</text>
        <text x="452" y="392" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DB rows + code changes</text>

        <!-- 4. Branch 1 -->
        <rect x="668" y="88" width="228" height="84" rx="6" fill="#f5f5f4"/>
        <rect x="668" y="88" width="228" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="680" y="98" width="56" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="708" y="108" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRANCH 1</text>
        <text x="782" y="134" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent A (MicroVM)</text>
        <text x="782" y="154" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">172.16.0.2 · PG :5432</text>

        <!-- 5. Branch 2 -->
        <rect x="668" y="200" width="228" height="84" rx="6" fill="#f5f5f4"/>
        <rect x="668" y="200" width="228" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="680" y="210" width="56" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="708" y="220" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRANCH 2</text>
        <text x="782" y="246" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent B (MicroVM)</text>
        <text x="782" y="266" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">172.16.0.2 · PG :5432</text>

        <!-- 6. Branch 3 -->
        <rect x="668" y="316" width="228" height="84" rx="6" fill="#f5f5f4"/>
        <rect x="668" y="316" width="228" height="84" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="680" y="326" width="56" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="708" y="336" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRANCH 3</text>
        <text x="782" y="362" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent C (MicroVM)</text>
        <text x="782" y="382" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">172.16.0.2 · PG :5432</text>

        <!-- LEGEND STRIP -->
        <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(20,20,20,0.12)" stroke-width="0.8"/>
        <text x="40" y="496" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="128" y="486" width="14" height="14" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <text x="150" y="497" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">Shared RAM (stored 1x)</text>

        <rect x="336" y="486" width="14" height="14" rx="2" fill="rgba(20,20,20,0.04)" stroke="#525252" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="358" y="497" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">Private CoW pages (on write)</text>

        <line x1="584" y1="493" x2="612" y2="493" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>
        <text x="622" y="497" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">Read shared page</text>

        <line x1="764" y1="493" x2="792" y2="493" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <text x="802" y="497" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">4 KB write fault</text>
      </svg>
    </div>
  </div>
</body>
</html>
