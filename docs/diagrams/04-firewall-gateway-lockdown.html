<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f4;
      --color-ink:     #141414;
      --color-muted:   #525252;
      --color-soft:    #737373;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>

        <!-- 4. External LLM API -->
        <rect x="792" y="208" width="128" height="104" rx="6" fill="#f5f5f4"/>

        <!-- LEGEND STRIP -->
        <line x1="40" y1="476" x2="920" y2="476" stroke="rgba(20,20,20,0.12)" stroke-width="0.8"/>

        <line x1="352" y1="496" x2="380" y2="496" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3"/>
        <circle cx="388" cy="496" r="6" fill="#f5f5f4" stroke="#141414" stroke-width="1"/>
        <line x1="385" y1="493" x2="391" y2="499" stroke="#141414" stroke-width="1.2"/>
        <line x1="391" y1="493" x2="385" y2="499" stroke="#141414" stroke-width="1.2"/>

        <rect x="572" y="489" width="14" height="14" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <text x="594" y="500" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">Security enforcement point</text>
      </svg>
    </div>
  </div>
