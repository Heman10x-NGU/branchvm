<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>branchvm Architecture Overview</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f4;
      --color-ink:     #141414;
      --color-muted:   #525252;
      --color-soft:    #737373;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">BRANCHVM · SYSTEM ARCHITECTURE · MONOCHROME</p>
    <h1>One Host, N Isolated Full-Stack MicroVM Branches</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-overview-title arch-overview-desc">
        <title id="arch-overview-title">branchvm End-to-End Architecture</title>
        <desc id="arch-overview-desc">System overview showing the branchvm CLI, shared golden memory snapshot, XFS reflink disk pool, a Firecracker microVM inside cgroups v2 and an nftables policy drop network namespace, the host LLM gateway, and git diff promotion back to the host repo.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#525252"/>
          </marker>
          <marker id="arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#141414"/>
          </marker>
          <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#737373"/>
          </marker>
        </defs>

        <!-- Clean paper background -->
        <rect width="100%" height="100%" fill="#f5f5f4"/>

        <!-- ZONES -->
        <!-- Left Zone: Host CLI & Base Pool -->
        <rect x="40" y="44" width="236" height="404" rx="8" fill="rgba(20,20,20,0.025)" stroke="rgba(20,20,20,0.14)" stroke-width="0.8"/>
        <rect x="52" y="48" width="164" height="14" rx="2" fill="#f5f5f4"/>
        <text x="134" y="58" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HOST · CLI &amp; BASE POOL</text>

        <!-- Center Zone: Branch i Isolation Boundary -->
        <rect x="344" y="44" width="308" height="404" rx="8" fill="rgba(20,20,20,0.025)" stroke="rgba(20,20,20,0.18)" stroke-width="0.8"/>
        <rect x="356" y="48" width="208" height="14" rx="2" fill="#f5f5f4"/>
        <text x="460" y="58" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BRANCH i · ISOLATED SANDBOX</text>

        <!-- cgroups v2 dashed cage around MicroVM -->
        <rect x="360" y="76" width="276" height="204" rx="8" fill="rgba(20,20,20,0.035)" stroke="#141414" stroke-width="1.2" stroke-dasharray="5,3"/>
        <rect x="372" y="80" width="92" height="14" rx="2" fill="#141414"/>
        <text x="418" y="90" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CGROUPS V2</text>
        <text x="550" y="90" fill="#525252" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">mem · cpu · pids caps</text>

        <!-- CONNECTORS (drawn before nodes, zero crossings) -->
        <!-- 1. CLI -> MicroVM (straight horizontal y=124) -->
        <line x1="260" y1="124" x2="376" y2="124" stroke="#525252" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="282" y="100" width="76" height="14" rx="2" fill="#f5f5f4"/>
        <text x="320" y="110" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNC &amp; EXEC</text>

        <!-- 2. Golden Snapshot -> MicroVM (straight horizontal y=212) -->
        <line x1="260" y1="212" x2="376" y2="212" stroke="#141414" stroke-width="1.6" marker-end="url(#arrow-focal)"/>
        <rect x="280" y="188" width="80" height="14" rx="2" fill="#f5f5f4"/>
        <text x="320" y="198" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SHARED RAM</text>

        <!-- 3. XFS Pool -> MicroVM (port y=368 -> elbow at x=300 -> y=248 -> MicroVM left edge) -->
        <path d="M 260,368 H 292 Q 300,368 300,360 V 256 Q 300,248 308,248 H 376" fill="none" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>
        <rect x="310" y="280" width="56" height="14" rx="2" fill="#f5f5f4"/>
        <text x="338" y="290" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1MS COW</text>

        <!-- 4. MicroVM bottom (498, 264) -> netns Firewall top (498, 312) -->
        <line x1="498" y1="264" x2="498" y2="312" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>
        <rect x="508" y="284" width="76" height="14" rx="2" fill="#f5f5f4"/>
        <text x="546" y="294" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DUMMY KEY</text>

        <!-- 5. MicroVM right (620, 124) -> Host Repo (732, 124) dashed winner diff -->
        <line x1="620" y1="124" x2="732" y2="124" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <rect x="644" y="100" width="80" height="14" rx="2" fill="#f5f5f4"/>
        <text x="684" y="110" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WINNER DIFF</text>

        <!-- 6. netns Firewall right (636, 372) -> elbow at x=664 -> Host Gateway left (732, 256) -->
        <path d="M 636,372 H 656 Q 664,372 664,364 V 264 Q 664,256 672,256 H 732" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#arrow-focal)"/>
        <rect x="668" y="232" width="60" height="14" rx="2" fill="#f5f5f4"/>
        <text x="698" y="242" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 PINHOLE</text>

        <!-- 7. Host Gateway bottom (826, 316) -> LLM APIs top (826, 364) -->
        <line x1="826" y1="316" x2="826" y2="364" stroke="#141414" stroke-width="1.4" marker-end="url(#arrow-focal)"/>
        <rect x="836" y="332" width="68" height="14" rx="2" fill="#f5f5f4"/>
        <text x="870" y="342" fill="#141414" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REAL TLS</text>

        <!-- NODES -->
        <!-- 1. branchvm CLI -->
        <rect x="56" y="80" width="204" height="88" rx="6" fill="#f5f5f4"/>
        <rect x="56" y="80" width="204" height="88" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="68" y="90" width="44" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="90" y="100" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
        <text x="158" y="126" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">branchvm</text>
        <text x="158" y="148" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">init · run · apply · verify</text>

        <!-- 2. Golden Snapshot -->
        <rect x="56" y="188" width="204" height="104" rx="6" fill="#f5f5f4"/>
        <rect x="56" y="188" width="204" height="104" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="68" y="198" width="64" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="100" y="208" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SNAPSHOT</text>
        <text x="158" y="234" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Golden RAM + CPU</text>
        <text x="158" y="254" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vm.mem (1 GiB) · snapshot</text>
        <text x="158" y="272" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">shared via MAP_PRIVATE / UFFD</text>

        <!-- 3. XFS Reflink Pool -->
        <rect x="56" y="316" width="204" height="108" rx="6" fill="#f5f5f4"/>
        <rect x="56" y="316" width="204" height="108" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1"/>
        <rect x="68" y="326" width="84" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="110" y="336" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">XFS REFLINK</text>
        <text x="158" y="364" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copy-on-Write Disk Pool</text>
        <text x="158" y="384" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">golden/rootfs.ext4 (1.5 GB)</text>
        <text x="158" y="402" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">clones cost +0 B until write</text>

        <!-- 4. Firecracker MicroVM (FOCAL) -->
        <rect x="376" y="108" width="244" height="156" rx="6" fill="#f5f5f4"/>
        <rect x="376" y="108" width="244" height="156" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <rect x="388" y="118" width="96" height="14" rx="2" fill="#141414"/>
        <text x="436" y="128" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">KVM MICROVM</text>
        <text x="498" y="156" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Firecracker Guest (Branch i)</text>
        <text x="498" y="178" fill="#141414" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">own guest Linux kernel</text>
        <text x="498" y="198" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PID 1: execd (:8080) · /workspace</text>
        <text x="498" y="218" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Postgres 16 on 127.0.0.1:5432</text>
        <text x="498" y="238" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">agent key: bvm_dummy_i only</text>

        <!-- 5. netns + nftables Firewall -->
        <rect x="360" y="312" width="276" height="116" rx="6" fill="#f5f5f4"/>
        <rect x="360" y="312" width="276" height="116" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.2"/>
        <rect x="372" y="322" width="76" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.40)" stroke-width="0.8"/>
        <text x="410" y="332" fill="#141414" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POLICY DROP</text>
        <text x="498" y="358" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">netns + nftables Firewall</text>
        <text x="498" y="378" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">veth 10.200.i.2 -> tap0 (172.16.0.2)</text>
        <text x="498" y="396" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drops WAN, LAN, IMDS, DNS 53/853</text>
        <text x="498" y="414" fill="#141414" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">allows only 10.200.i.1:18080</text>

        <!-- 6. Host Repo (Untouched) -->
        <rect x="732" y="80" width="188" height="88" rx="6" fill="#f5f5f4"/>
        <rect x="732" y="80" width="188" height="88" rx="6" fill="rgba(20,20,20,0.035)" stroke="#525252" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="744" y="90" width="76" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="782" y="100" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APPLY WINNER</text>
        <text x="826" y="126" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host Git Repo</text>
        <text x="826" y="148" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">untouched until apply</text>

        <!-- 7. Zero-MITM Host Gateway (FOCAL) -->
        <rect x="732" y="196" width="188" height="120" rx="6" fill="#f5f5f4"/>
        <rect x="732" y="196" width="188" height="120" rx="6" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <rect x="744" y="206" width="76" height="14" rx="2" fill="#141414"/>
        <text x="782" y="216" fill="#ffffff" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ZERO-MITM</text>
        <text x="826" y="242" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Host LLM Gateway</text>
        <text x="826" y="262" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.200.i.1:18080</text>
        <text x="826" y="280" fill="#141414" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">swaps REAL API key</text>
        <text x="826" y="298" fill="#737373" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no fake root CA</text>

        <!-- 8. External LLM APIs -->
        <rect x="732" y="364" width="188" height="84" rx="6" fill="#f5f5f4"/>
        <rect x="732" y="364" width="188" height="84" rx="6" fill="rgba(20,20,20,0.03)" stroke="rgba(20,20,20,0.35)" stroke-width="1"/>
        <rect x="744" y="374" width="60" height="14" rx="2" fill="none" stroke="rgba(20,20,20,0.35)" stroke-width="0.8"/>
        <text x="774" y="384" fill="#525252" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXTERNAL</text>
        <text x="826" y="410" fill="#141414" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anthropic / OpenAI</text>
        <text x="826" y="430" fill="#525252" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.anthropic.com · openai</text>

        <!-- LEGEND STRIP -->
        <line x1="40" y1="476" x2="920" y2="476" stroke="rgba(20,20,20,0.12)" stroke-width="0.8"/>
        <text x="40" y="500" fill="#525252" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="128" y="490" width="14" height="14" rx="2" fill="#ffffff" stroke="#141414" stroke-width="1.8"/>
        <text x="150" y="501" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">Core isolation boundary</text>

        <rect x="336" y="490" width="14" height="14" rx="2" fill="rgba(20,20,20,0.035)" stroke="#141414" stroke-width="1.2" stroke-dasharray="4,2"/>
        <text x="358" y="501" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">cgroups v2 resource cage</text>

        <line x1="556" y1="497" x2="584" y2="497" stroke="#141414" stroke-width="1.6" marker-end="url(#arrow-focal)"/>
        <text x="594" y="501" fill="#141414" font-size="9" font-family="'Geist Mono', monospace">Primary runtime path</text>

        <line x1="752" y1="497" x2="780" y2="497" stroke="#737373" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
        <text x="790" y="501" fill="#525252" font-size="9" font-family="'Geist Mono', monospace">Apply winning patch</text>
      </svg>
    </div>
  </div>
</body>
</html>
