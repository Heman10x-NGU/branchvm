name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build static binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/scripts
          go build -ldflags="-s -w" -o dist/branchvm ./cmd/branchvm
          go build -ldflags="-s -w" -o dist/execd ./cmd/execd
          cp scripts/fetch-assets.sh dist/scripts/fetch-assets.sh
          chmod +x dist/branchvm dist/execd dist/scripts/fetch-assets.sh

      - name: Package tarball
        env:
          TAG: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          NAME="branchvm_${TAG}_linux_${GOARCH}.tar.gz"
          tar -czf "${NAME}" -C dist branchvm execd scripts/fetch-assets.sh
          sha256sum "${NAME}" > "${NAME}.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            branchvm_${{ github.ref_name }}_linux_${{ matrix.goarch }}.tar.gz
            branchvm_${{ github.ref_name }}_linux_${{ matrix.goarch }}.tar.gz.sha256

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p sums
          gh release download "${TAG}" -D sums -p "*.tar.gz"
          (cd sums && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload "${TAG}" sums/SHA256SUMS --clobber
